name: Update progress chart

on:
  push:
    branches: [main]
    paths: ["tracking/*.csv", "tracking/make_chart.py"]
  schedule:
    - cron: "17 12 * * 1"   # Mondays, so the "today" marker moves forward
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install matplotlib
      - run: python tracking/make_chart.py
      - name: Commit chart if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracking/progress.png
          git diff --cached --quiet || (git commit -m "Update progress chart" && git push)
